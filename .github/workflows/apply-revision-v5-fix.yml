name: Apply revision v5 fixed

on:
  push:
    branches: [lighthouse-2-rewrite]
    paths: [.github/workflows/apply-revision-v5-fix.yml]

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: lighthouse-2-rewrite
      - name: Patch applicator and apply requested revision
        run: |
          sed -i "s#import 'physical_point.dart';#import '../domain/physical_point.dart';#g" tooling/apply_revision_v5.py
          python tooling/apply_revision_v5.py
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: flutter pub get
      - run: dart format lib test
      - run: flutter analyze
      - run: flutter test
      - name: Commit implementation
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add lib test CHANGELOG.md
          git commit -m "feat: refine toys and game boards"
          git push origin HEAD:lighthouse-2-rewrite
