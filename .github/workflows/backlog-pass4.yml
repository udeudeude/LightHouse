name: Validated backlog pass

on:
  push:
    branches:
      - lighthouse-2-rewrite
    paths:
      - .github/workflows/backlog-pass4.yml

permissions:
  contents: write

jobs:
  improve:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: lighthouse-2-rewrite
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Apply improvements
        run: python3 .github/scripts/apply_backlog_pass.py
      - name: Get packages
        run: flutter pub get
      - name: Format
        run: dart format lib test
      - name: Analyze
        run: flutter analyze
      - name: Test
        run: flutter test
      - name: Release web build
        run: flutter build web --release --base-href /LightHouse-StashBoard/
      - name: Commit validated changes
        shell: bash
        run: |
          rm -f .github/scripts/apply_backlog_pass.py
          rm -f .github/workflows/backlog-pass.yml
          rm -f .github/workflows/backlog-pass3.yml
          rm -f .github/workflows/backlog-pass4.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "feat: recover autosaves and tighten board runtime"
          git push origin HEAD:lighthouse-2-rewrite
