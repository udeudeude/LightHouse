name: CI

on:
  push:
  pull_request:

jobs:
  analyze-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: flutter pub get
      - run: dart format --output=show lib/ui/dice_bubble.dart
      - run: |
          find lib test -name '*.dart' \
            ! -path 'lib/application/app_language.dart' \
            ! -path 'lib/ui/board_screen.dart' \
            ! -path 'lib/ui/dice_bubble.dart' \
            -print0 | xargs -0 dart format --output=none --set-exit-if-changed
      - run: dart format --output=none --set-exit-if-changed lib/ui/dice_bubble.dart test/ui/dice_bubble_art_test.dart test/ui/remote_overlay_snapshot_test.dart
      - run: flutter analyze
      - run: flutter test
