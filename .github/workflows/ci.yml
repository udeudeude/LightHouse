name: CI

on:
  push:
  pull_request:

jobs:
  analyze-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: flutter pub get
      - run: dart format lib test
      - uses: actions/upload-artifact@v4
        with:
          name: formatted-sources
          path: |
            lib/application/app_language.dart
            lib/ui/dice_bubble.dart
      - run: git diff --exit-code -- lib test
      - run: flutter analyze
      - run: flutter test
