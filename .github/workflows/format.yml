name: Auto format

on:
  push:
    branches:
      - dice-spider-icon-polish
  workflow_dispatch:

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: dice-spider-icon-polish
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Format Dart
        run: dart format lib test
      - name: Commit formatting
        run: |
          if git diff --quiet; then
            echo "Already formatted"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add lib test
          git commit -m "chore: format Dart"
          git push origin HEAD:dice-spider-icon-polish
