name: Performance UI revision

on:
  push:
    branches:
      - lighthouse-2-rewrite
    paths:
      - tools/perf_ui_revision.py

permissions:
  contents: write

jobs:
  optimize-ui:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: lighthouse-2-rewrite
          fetch-depth: 0
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Apply animation isolation
        run: python3 tools/perf_ui_revision.py
      - name: Get packages
        run: flutter pub get
      - name: Format
        run: dart format lib test
      - name: Analyze
        run: flutter analyze
      - name: Test
        run: flutter test
      - name: Build web release
        run: flutter build web --release --base-href /LightHouse-StashBoard/
      - name: Remove staging files
        run: git rm .github/workflows/perf_ui_revision.yml tools/perf_ui_revision.py
      - name: Commit animation isolation
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "perf: isolate animated board repainting"
          git push origin HEAD:lighthouse-2-rewrite
