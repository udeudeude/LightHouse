name: Performance revision

on:
  push:
    branches:
      - lighthouse-2-rewrite
    paths:
      - tools/**
  workflow_dispatch:

permissions:
  contents: write

jobs:
  optimize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: lighthouse-2-rewrite
          fetch-depth: 0
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Apply performance revision
        run: python3 tools/performance_revision.py
      - name: Remove final rotation-workaround reference
        run: |
          sed -i 's/final size = _webBoardSize ?? MediaQuery.sizeOf(context);/final size = MediaQuery.sizeOf(context);/' lib/ui/board_screen_next.dart
          if grep -nE '_webBoard|_webReferenceOrientation|_webObservedOrientation|currentWebOrientationAngle' lib/ui/board_screen_next.dart; then
            echo "Rotation workaround references remain"
            exit 1
          fi
      - name: Get packages
        run: flutter pub get
      - name: Format
        run: dart format lib test
      - name: Analyze
        run: flutter analyze
      - name: Test
        run: flutter test
      - name: Build web release
        run: flutter build web --release --base-href /LightHouse-StashBoard/
      - name: Remove staging files
        run: git rm .github/workflows/performance_revision.yml tools/performance_revision.py tools/performance_revision.trigger
      - name: Commit optimized implementation
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "perf: reduce web runtime overhead"
          git push origin HEAD:lighthouse-2-rewrite
