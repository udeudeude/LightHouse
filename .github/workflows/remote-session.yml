name: Remote session implementation

on:
  push:
    branches:
      - lighthouse-2-rewrite
    paths:
      - .github/workflows/remote-session.yml

permissions:
  contents: write

jobs:
  implement:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: lighthouse-2-rewrite
          fetch-depth: 0
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Apply remote session feature
        run: python3 .github/scripts/apply_remote_session.py
      - name: Get packages
        run: flutter pub get
      - name: Format
        run: dart format lib test
      - name: Analyze
        run: flutter analyze
      - name: Test
        run: flutter test
      - name: Release web build
        run: flutter build web --release --base-href /LightHouse-StashBoard/
      - name: Commit validated feature
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "feat: add paired remote display and controller"
          git push origin HEAD:lighthouse-2-rewrite
