name: Remote transport foundation

on:
  push:
    branches:
      - remote-transport-foundation
    paths:
      - .github/workflows/remote-transport-foundation.yml

permissions:
  contents: write

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: remote-transport-foundation
          fetch-depth: 0
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: dart format lib test
      - run: flutter pub get
      - run: flutter analyze
      - run: flutter test
      - run: flutter build web --release --base-href /LightHouse/
      - name: Commit validated changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/remote-transport-foundation.yml
          git add -A
          git commit -m "refactor: prepare Remote for local transports"
          git push origin HEAD:remote-transport-foundation
