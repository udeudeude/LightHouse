name: Remote viewport fix

on:
  push:
    branches:
      - fix-remote-viewport
    paths:
      - .github/workflows/remote-viewport-fix.yml

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix-remote-viewport
          fetch-depth: 0
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: python3 tool/remote_viewport_fix.py
      - run: dart format lib test
      - run: flutter pub get
      - run: flutter analyze
      - run: flutter test
      - run: flutter build web --release --base-href /LightHouse/
      - name: Commit validated fix
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/remote-viewport-fix.yml tool/remote_viewport_fix.py
          git add -A
          git commit -m "fix: mirror remote display viewport"
          git push origin HEAD:fix-remote-viewport
