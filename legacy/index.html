<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"><meta name="apple-mobile-web-app-capable" content="yes"><title>Abandoned Lighthouse</title><style>html,body{margin:0;background:#000;color:#eee;font:16px Arial;overflow:hidden}canvas{display:block}button,input,select{font:16px Arial}button{background:#252525;color:white;border:1px solid #777;padding:9px;margin:3px}#toolbar{position:absolute;top:3px;left:3px}#panel{display:none;position:absolute;top:48px;left:5px;right:5px;max-width:420px;max-height:75%;overflow:auto;background:#171717;border:1px solid #777;padding:12px;box-sizing:border-box}p{font-size:14px;line-height:1.4}label{display:block;margin:10px 0}</style></head><body><canvas id="c"></canvas><div id="toolbar"><button id="menu">☰ Abandoned Lighthouse</button><button id="undo">Undo</button><button id="redo">Redo</button></div><div id="panel"><h3>Abandoned Lighthouse</h3><button id="add">Add</button><button id="clear">New</button><button id="save">Save</button><button id="load">Load</button><button id="size">Cycle size</button><button id="light">Full / outline</button><button id="flat">Upright / flat</button><button id="left">↶ 45°</button><button id="right">↷ 45°</button><button id="del">Delete</button><label>Grid <select id="grid"><option value="none">None</option><option value="square">Square</option><option value="checker">Checker</option><option value="martian">Martian Chess</option></select></label><label>Pixels per mm <input id="ppm" type="number" min="1" max="30" step=".1" value="4"></label><button id="ref">Show 25.4 mm calibration square</button><div id="reference" style="display:none;background:#fff;width:101.6px;height:101.6px"></div><button id="export">Export JSON</button><button id="import">Import JSON</button><p>Double tap empty space to add. Double tap a pyramid to cycle Small, Medium, Large, then remove. Drag to move; tap to select. Two fingers pan. Use the menu for rotation and other controls. Calibrate using a ruler and the reference square.</p><button id="close">Close</button></div><script>
(function(){'use strict';var c=document.getElementById('c'),g=c.getContext&&c.getContext('2d');if(!g){document.body.innerHTML='HTML5 Canvas required';return;}var s=[],sel=-1,h=[],redo=[],ppm=4,grid='none',ox=0,oy=0,start=null,last=0,lastX=0,lastY=0,pan=null,key='abandoned-lighthouse-v1',sizes=[12.7,19.05,25.4];function E(id){return document.getElementById(id);}function snapshot(){return JSON.stringify({shapes:s,ppm:ppm,grid:grid,ox:ox,oy:oy});}function checkpoint(){h.push(snapshot());if(h.length>50)h.shift();redo=[];}function save(){try{localStorage.setItem(key,snapshot());}catch(e){}}function load(t){var d=JSON.parse(t);if(!d||Object.prototype.toString.call(d.shapes)!=='[object Array]')throw Error('Bad board');s=[];for(var i=0;i<d.shapes.length&&i<300;i++){var a=d.shapes[i];if(isFinite(a.x)&&isFinite(a.y)&&isFinite(a.size))s.push({x:+a.x,y:+a.y,size:Math.max(0,Math.min(2,Math.round(a.size))),angle:+a.angle||0,outline:!!a.outline,flat:!!a.flat});}ppm=isFinite(d.ppm)?Math.max(1,Math.min(30,+d.ppm)):4;grid=/^(none|square|checker|martian)$/.test(d.grid)?d.grid:'none';ox=+d.ox||0;oy=+d.oy||0;sel=-1;update();}function update(){E('ppm').value=ppm;E('grid').value=grid;E('reference').style.width=25.4*ppm+'px';E('reference').style.height=25.4*ppm+'px';save();draw();}function xy(x,y){return{x:(x-c.width/2-ox)/ppm,y:(y-c.height/2-oy)/ppm};}function hit(p){for(var i=s.length-1;i>=0;i--){var a=s[i],dx=p.x-a.x,dy=p.y-a.y,rad=-a.angle*Math.PI/180,rx=dx*Math.cos(rad)-dy*Math.sin(rad),ry=dx*Math.sin(rad)+dy*Math.cos(rad);if(Math.abs(rx)<sizes[a.size]/2+2&&Math.abs(ry)<sizes[a.size]/2+2)return i;}return -1;}function draw(){g.fillStyle='#000';g.fillRect(0,0,c.width,c.height);var step=25.4*ppm,x,y,i,j,cx=c.width/2+ox,cy=c.height/2+oy;if(grid!=='none'){g.strokeStyle='#292929';g.lineWidth=1;for(i=-30;i<30;i++)for(j=-30;j<30;j++){if(grid==='martian'&&(i<0||i>3||j<0||j>7))continue;x=cx+i*step-(grid==='martian'?2*step:0);y=cy+j*step-(grid==='martian'?4*step:0);if(x>c.width||y>c.height||x+step<0||y+step<0)continue;if(grid!=='square'){g.fillStyle=(i+j)%2?'#101010':'#202020';g.fillRect(x,y,step,step);}g.strokeRect(x,y,step,step);}}for(i=0;i<s.length;i++){var a=s[i],half=sizes[a.size]*ppm/2;g.save();g.translate(cx+a.x*ppm,cy+a.y*ppm);g.rotate(a.angle*Math.PI/180);g.lineWidth=Math.max(2,ppm*.6);g.strokeStyle=i===sel?'#ffb54d':'white';g.fillStyle='white';if(a.flat){g.beginPath();g.moveTo(-half,-half);g.lineTo(half,-half);g.lineTo(0,half);g.closePath();g.fill();g.stroke();}else if(a.outline)g.strokeRect(-half,-half,half*2,half*2);else{g.fillRect(-half,-half,half*2,half*2);if(i===sel)g.strokeRect(-half-3,-half-3,half*2+6,half*2+6);}g.restore();}}function resize(){c.width=window.innerWidth;c.height=window.innerHeight;draw();}function add(p){checkpoint();s.push({x:p.x,y:p.y,size:0,angle:0,outline:false,flat:false});sel=s.length-1;update();}function down(x,y,n){if(n>1){pan={x:x,y:y,ox:ox,oy:oy};start=null;return;}var p=xy(x,y);start={x:x,y:y,p:p,idx:hit(p),old:snapshot(),moved:false};}function move(x,y,n){if(n>1){if(!pan)pan={x:x,y:y,ox:ox,oy:oy};ox=pan.ox+x-pan.x;oy=pan.oy+y-pan.y;draw();return;}if(!start)return;if(Math.abs(x-start.x)+Math.abs(y-start.y)>9)start.moved=true;if(start.moved&&start.idx>=0){var p=xy(x,y),a=s[start.idx];a.x+=p.x-start.p.x;a.y+=p.y-start.p.y;start.p=p;draw();}}function up(x,y){if(pan){pan=null;save();return;}if(!start)return;var p=xy(x,y);if(start.moved){if(start.idx>=0){h.push(start.old);redo=[];}save();}else{var now=(new Date()).getTime();if(now-last<400&&Math.abs(x-lastX)<35&&Math.abs(y-lastY)<35){var i=hit(p);if(i<0)add(p);else{checkpoint();if(s[i].size===2){s.splice(i,1);sel=-1;}else{s[i].size++;sel=i;}update();}last=0;}else{sel=hit(p);draw();last=now;lastX=x;lastY=y;}}start=null;}function touch(e){var t=e.touches[0]||e.changedTouches[0];return t?{x:t.clientX,y:t.clientY}:null;}c.addEventListener('touchstart',function(e){e.preventDefault();var p=touch(e);if(p)down(p.x,p.y,e.touches.length);},false);c.addEventListener('touchmove',function(e){e.preventDefault();var p=touch(e);if(p)move(p.x,p.y,e.touches.length);},false);c.addEventListener('touchend',function(e){e.preventDefault();if(e.touches.length)return;var p=touch(e);if(p)up(p.x,p.y);},false);c.addEventListener('touchcancel',function(){start=null;pan=null;},false);c.onmousedown=function(e){down(e.clientX,e.clientY,1);};window.onmousemove=function(e){if(start)move(e.clientX,e.clientY,1);};window.onmouseup=function(e){if(start)up(e.clientX,e.clientY);};function bind(id,fn){E(id).onclick=function(){fn();update();};}function edit(fn){if(sel<0)return;checkpoint();fn(s[sel]);}bind('menu',function(){E('panel').style.display=E('panel').style.display==='block'?'none':'block';});bind('close',function(){E('panel').style.display='none';});bind('add',function(){add({x:0,y:0});});bind('clear',function(){if(confirm('Clear board?')){checkpoint();s=[];sel=-1;}});bind('size',function(){edit(function(a){a.size=(a.size+1)%3;});});bind('light',function(){edit(function(a){a.outline=!a.outline;});});bind('flat',function(){edit(function(a){a.flat=!a.flat;});});bind('left',function(){edit(function(a){a.angle-=45;});});bind('right',function(){edit(function(a){a.angle+=45;});});bind('del',function(){if(sel>=0){checkpoint();s.splice(sel,1);sel=-1;}});bind('undo',function(){if(h.length){redo.push(snapshot());load(h.pop());}});bind('redo',function(){if(redo.length){h.push(snapshot());load(redo.pop());}});bind('save',function(){save();alert('Board saved locally.');});bind('load',function(){try{var v=localStorage.getItem(key);if(v)load(v);else alert('No saved board');}catch(e){alert(e.message);}});E('grid').onchange=function(){checkpoint();grid=this.value;update();};E('ppm').onchange=function(){var n=parseFloat(this.value);if(isFinite(n)&&n>=1&&n<=30){checkpoint();ppm=n;}update();};bind('ref',function(){E('reference').style.display=E('reference').style.display==='none'?'block':'none';});bind('export',function(){var a=document.createElement('a'),v=snapshot();if(typeof Blob!=='undefined'&&window.URL&&URL.createObjectURL&&'download' in a){var u=URL.createObjectURL(new Blob([v],{type:'application/json'}));a.href=u;a.download='abandoned-lighthouse.json';document.body.appendChild(a);a.click();document.body.removeChild(a);setTimeout(function(){URL.revokeObjectURL(u);},1000);}else prompt('Copy JSON:',v);});bind('import',function(){var t=prompt('Paste board JSON:');if(t)try{checkpoint();load(t);}catch(e){alert('Invalid JSON: '+e.message);}});try{var old=localStorage.getItem(key);if(old)load(old);}catch(e){}resize();window.addEventListener('resize',resize,false);})();
</script></body></html>
