<!DOCTYPE html>
<html>
<head>
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <meta name="description" content="LightHouse: an interactive illuminated physical play surface for Looney Pyramids.">
  <meta name="theme-color" content="#000000">

  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="LightHouse">
  <link rel="apple-touch-icon" sizes="180x180" href="icons/Icon-180.png">
  <link rel="icon" type="image/png" href="favicon.png?v=46">

  <title>LightHouse</title>
  <link rel="manifest" href="manifest.json?v=46">
</head>
<body style="margin:0;background:#000000;">
  <script>
    const lighthouseMotionState = {
      x: Number.NaN,
      y: Number.NaN,
      z: Number.NaN,
      installed: false,
    };

    function lighthouseInstallMotionListener() {
      if (lighthouseMotionState.installed) return;
      lighthouseMotionState.installed = true;
      window.addEventListener('devicemotion', function (event) {
        const acceleration = event.accelerationIncludingGravity;
        if (!acceleration) return;
        lighthouseMotionState.x = Number(acceleration.x);
        lighthouseMotionState.y = Number(acceleration.y);
        lighthouseMotionState.z = Number(acceleration.z);
      }, { passive: true });
    }

    window.lighthouseRequestMotionPermission = async function () {
      try {
        let granted = true;
        if (typeof DeviceMotionEvent !== 'undefined' &&
            typeof DeviceMotionEvent.requestPermission === 'function') {
          granted = (await DeviceMotionEvent.requestPermission()) === 'granted';
        }
        if (granted) lighthouseInstallMotionListener();
        return granted;
      } catch (_) {
        return false;
      }
    };

    window.lighthouseMotionX = function () { return lighthouseMotionState.x; };
    window.lighthouseMotionY = function () { return lighthouseMotionState.y; };
    window.lighthouseMotionZ = function () { return lighthouseMotionState.z; };

    const lighthouseCalibrationCookie = 'lighthouse_calibration';

    window.lighthouseReadCalibrationCookie = function () {
      const prefix = lighthouseCalibrationCookie + '=';
      const entry = document.cookie
        .split(';')
        .map(function (part) { return part.trim(); })
        .find(function (part) { return part.startsWith(prefix); });
      if (!entry) return Number.NaN;
      const value = Number(decodeURIComponent(entry.substring(prefix.length)));
      return Number.isFinite(value) && value > 0 ? value : Number.NaN;
    };

    window.lighthouseWriteCalibrationCookie = function (value) {
      const numeric = Number(value);
      if (!Number.isFinite(numeric) || numeric <= 0) return;
      document.cookie = lighthouseCalibrationCookie + '=' +
        encodeURIComponent(String(numeric)) +
        '; Max-Age=31536000; Path=/; SameSite=Lax; Secure';
    };

    window.lighthouseClearCalibrationCookie = function () {
      document.cookie = lighthouseCalibrationCookie +
        '=; Max-Age=0; Path=/; SameSite=Lax; Secure';
    };
  </script>
  <script>
    // Offer a recovery path only on older iPad Safari if Flutter never paints.
    // Modern devices and successfully started sessions remain unchanged.
    (function () {
      var ua = navigator.userAgent || '';
      var oldIPad = /iPad/.test(ua) && /OS (12|13|14|15)_/.test(ua);
      if (!oldIPad) return;
      var started = false;
      var fallback;
      window.addEventListener('flutter-first-frame', function () {
        started = true;
        if (fallback && fallback.parentNode) {
          fallback.parentNode.removeChild(fallback);
        }
      });
      window.setTimeout(function () {
        if (started) return;
        fallback = document.createElement('a');
        fallback.href = 'legacy/';
        fallback.textContent = 'Having trouble loading? Open Abandoned Lighthouse';
        fallback.setAttribute('aria-label', 'Open the lightweight version for older iPads');
        fallback.style.cssText = 'position:fixed;bottom:16px;left:12px;right:12px;' +
          'z-index:99999;background:#242424;color:white;border:1px solid #777;' +
          'padding:13px 10px;text-align:center;font:15px Arial,sans-serif;' +
          'text-decoration:underline;border-radius:6px';
        document.body.appendChild(fallback);
      }, 12000);
    }());
  </script>
  <script src="flutter_bootstrap.js?v=46" async></script>
</body>
</html>
